# Mangadeck + (optionally) Suwayomi-Server.
#
#   docker compose up -d --build            -> Mangadeck on http://localhost:8080
#
# Already running Suwayomi somewhere else? Do not start the `suwayomi` service below; run
#   SUWAYOMI_URL=http://192.168.1.50:4567 docker compose up -d --build --no-deps mangadeck
# (see docs/INSTALL.md).

services:
  mangadeck:
    build: .
    container_name: mangadeck
    restart: unless-stopped
    ports:
      - "8080:80"
    environment:
      # Where nginx forwards /api to. Use the service name when Suwayomi runs in this same compose file.
      SUWAYOMI_URL: ${SUWAYOMI_URL:-http://suwayomi:4567}
    depends_on:
      - suwayomi

  suwayomi:
    image: ghcr.io/suwayomi/tachidesk:stable
    container_name: suwayomi
    restart: unless-stopped
    environment:
      TZ: America/New_York # change to your time zone
      # Optional: add an extension repository at start (see docs/INSTALL.md)
      # EXTENSION_STORES: '["https://example.com/your-repo/index.min.json"]'
    volumes:
      - ./suwayomi-data:/home/suwayomi/.local/share/Tachidesk
    ports:
      - "4567:4567"
